name: Agente NeoAuto 24x7

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Ejecutar Agente
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agente_autos.py

      - name: Guardar historial actualizado en el repositorio
        run: |
          git config --global user.name 'Agente Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add autos_vistos.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar historial de autos vistos [skip ci]" && git push)
